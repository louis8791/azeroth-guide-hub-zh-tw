name: Refresh guide index

on:
  schedule:
    # GitHub cron uses UTC. These correspond to Asia/Taipei 02:17,
    # 08:17, 14:17 and 20:17.
    - cron: "17 18,0,6,12 * * *"
    # Asia/Taipei 03:17 and 04:17.
    - cron: "17 19 * * *"
    - cron: "17 20 * * *"
    # Asia/Taipei Sunday 02:17.
    - cron: "17 18 * * 6"
  workflow_dispatch:
    inputs:
      tier:
        description: Source tier
        required: true
        default: all
        type: choice
        options:
          - all
          - urgent
          - guides
          - stats
          - questions
          - backfill

permissions:
  contents: write

concurrency:
  group: content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-m2m100.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: m2m100-418m-${{ runner.os }}-v1

      - run: npm ci

      - name: Choose source tier
        id: tier
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 19 * * *" ]; then
            echo "value=guides" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 20 * * *" ]; then
            echo "value=questions" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 18 * * 6" ]; then
            echo "value=backfill" >> "$GITHUB_OUTPUT"
          else
            echo "value=all" >> "$GITHUB_OUTPUT"
          fi

      - run: node scripts/crawl-sources.mjs --tier=${{ steps.tier.outputs.value }}

      - run: pip install -r requirements-m2m100.txt

      - run: python3 scripts/translate-content.py --provider=m2m100

      - run: npm run build

      - name: Commit changed index
        shell: bash
        run: |
          git config user.name "Azeroth Guide Refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/content-source.json data/crawl-report.json data/translation-cache.json public/data/live-index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh guide index"
          git push
